name: Feature request
description: Suggest a tool, workflow, or improvement for game development with Harp.
title: "[Idea]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Harp aims to be the tool every Roblox developer can rely on, with UEFN next.
        Tell us what would make your game development faster or better. One idea per issue.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem in your game development, not the solution yet.
      placeholder: When I build shop UIs, I have to check every device by hand ...
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine Harp helping. Screenshots or examples from other tools are welcome.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Roblox Studio
        - Blender or 3D
        - UEFN
        - Agents and providers
        - Appearance and customization
        - Something else
    validations:
      required: true
