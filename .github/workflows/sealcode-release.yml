name: SealCode release

# Pushing a vX.Y.Z tag builds the Windows installer and publishes it as this
# repository's latest GitHub Release. Installed copies read that release's
# latest.yml and update themselves: the build bakes this repository into the
# installer's app-update.yml through T3CODE_DESKTOP_UPDATE_REPOSITORY.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build and publish again
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sealcode-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      # actions/checkout's credential cleanup walks submodules and fails on the
      # orphaned gitlinks in the vendored .repos tree, which the build skips.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags look like v1.2.3, got '$TAG'."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # Only the resource monitor build links against these.
      - name: Install Spectre-mitigated MSVC libs
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      # The server reports its package version to the Studio plugin and in diagnostics.
      - name: Stamp the server version
        shell: bash
        run: node -e "const f='apps/server/package.json';const fs=require('fs');const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - name: Build app
        env:
          # The web bundle shows this as the app version in Settings.
          APP_VERSION: ${{ env.VERSION }}
        run: vp run build:desktop

      - name: Build installer
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 \
            --build-version "$VERSION" --skip-build --verbose
          # Without the feed manifest installed copies would never see this release.
          test -f release/latest.yml
          test -f "release/SealCode-$VERSION-x64.exe"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=("release/SealCode-$VERSION-x64.exe" "release/SealCode-$VERSION-x64.exe.blockmap" release/latest.yml)
          # The version's CHANGELOG.md section is the release body, the same notes What's New shows.
          awk -v v="$VERSION" '$0 ~ "^## " { if (found) exit; found = ($2 == v); next } found'             CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION; using generated notes."
            notes=(--generate-notes)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "SealCode $VERSION" "${notes[@]}" --latest
          fi
